<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nexo Chat</title>

<style>
body{
    margin:0;
    font-family:sans-serif;
    background:#313338;
    color:white;
    display:flex;
    height:100vh;
}

/* servidores */
.servers{
    width:70px;
    background:#1e1f22;
}

/* canales */
.channels{
    width:220px;
    background:#2b2d31;
    padding:10px;
}

/* chat */
.chat{
    flex:1;
    display:flex;
    flex-direction:column;
    height:100vh;
}

/* mensajes */
#messages{
    list-style:none;
    padding:20px;
    margin:0;
    flex:1;
    overflow-y:auto;
}

/* input area */
.input-area{
    background:#383a40;
    padding:15px;
    display:flex;
    position:sticky;
    bottom:0;
}

#input{
    flex:1;
    padding:10px;
    font-size:16px;
    border:none;
    border-radius:6px;
}

/* ===== MOVIL ===== */
@media (max-width: 700px){

    .servers{
        display:none;
    }

    .channels{
        position:fixed;
        left:-240px;
        top:0;
        height:100%;
        z-index:1000;
        transition:.3s;
    }

    body{
        font-size:18px;
    }

    #messages{
        padding:10px;
        font-size:18px;
    }

    .input-area{
        padding:10px;
    }

    #input{
        font-size:18px;
        padding:14px;
    }

    button{
        font-size:18px;
        padding:14px 18px;
    }

}

button{
    margin-left:10px;
    padding:10px 15px;
    border:none;
    border-radius:6px;
    background:#5865f2;
    color:white;
    cursor:pointer;
}

li{
    margin-bottom:12px;
    max-width:70%;
    padding:10px 14px;
    border-radius:12px;
    background:#404249;
    word-wrap:break-word;
}

/* mensaje propio */
.me{
    background:#5865f2;
    margin-left:auto;
}

/* sistema */
.system{
    background:none;
    text-align:center;
    color:#aaa;
    font-style:italic;
    max-width:100%;
}

/* topbar + mobile menu */
.topbar{
    display:none;
    background:#2b2d31;
    padding:12px;
    font-size:20px;
}

.menu-btn{
    background:none;
    border:none;
    color:white;
    font-size:24px;
    margin-right:10px;
    cursor:pointer;
}

/* ===== MOVIL TOPBAR ===== */
@media (max-width:700px){

    .topbar{
        display:flex;
        align-items:center;
    }

    .servers{
        display:none;
    }

    .channels{
        position:fixed;
        left:-240px;
        top:0;
        height:100%;
        z-index:1000;
        transition:.3s;
    }

    .channels.open{
        left:0;
    }

}
</style>

</head>

<body>

<div class="servers"></div>

<div class="channels">
<b>Nexo</b>
<button onclick="changeName()">Cambiar nombre</button>
    <p onclick="switchChannel('general')"># general</p>
    <p onclick="switchChannel('gaming')"># gaming</p>
    <p onclick="switchChannel('tareas')"># tareas</p>
</div>

</div>

<div class="chat">

<div class="topbar">
<button class="menu-btn" onclick="toggleMenu()">☰</button>
<span># general</span>
</div>

<ul id="messages"></ul>

<div id="typing-indicator" style="padding:8px 20px;color:#aaa;font-style:italic;"></div>

<div class="input-area">
<input id="input" placeholder="Mensaje en #general" autocomplete="off" onkeydown="handleKey(event)">
<button onclick="sendMessage()">Enviar</button>
</div>

</div>

<div class="users" style="width:200px;background:#2b2d31;padding:10px;">
<b>Conectados</b>
<ul id="users"></ul>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>let currentChannel = "general";</script>

<script>
const socket = io();

let username = localStorage.getItem("nexo_username");

if(!username){
    username = prompt("Elegí tu nombre:");

    if(!username || username.trim()===""){
        username="Usuario"+Math.floor(Math.random()*1000);
    }

    localStorage.setItem("nexo_username", username);
}

function tryJoin(name){
    socket.emit("join", name);
}

// intentar entrar al cargar
tryJoin(username);
socket.emit("switch channel","general");

// si el nombre ya existe
socket.on("name taken", ()=>{
    alert("Ese nombre ya está en uso");
    username=null;

    while(!username){
        username=prompt("Elegí otro nombre:");
    }

    localStorage.setItem("nexo_username",username);
    tryJoin(username);
});

// si entra bien
socket.on("join success",(name)=>{
    username=name;
    localStorage.setItem("nexo_username",username);
});

function sendMessage(){
    const input=document.getElementById("input");
    const message=input.value;

    if(message){
        socket.emit("chat message",{
            user:username,
            text:message,
            channel:currentChannel
        });
        input.value="";
        document.querySelector(".channels").classList.remove("open");
    }
}

function handleKey(e){
    if(e.key==="Enter"){
        e.preventDefault();
        sendMessage();
    }
}

function changeName(){
    const newName = prompt("Nuevo nombre:");

    if(newName && newName.trim()!==""){
        username=newName;
        localStorage.setItem("nexo_username",username);
        socket.emit("join", username);
    }
}

function switchChannel(channel){

    currentChannel = channel;

    document.getElementById("messages").innerHTML="";

    socket.emit("switch channel", channel);

    document.querySelector(".channels").classList.remove("open");

}

// mensaje normal
socket.on("chat message",function(data){
    if(data.channel!==currentChannel) return;
    const li=document.createElement("li");

    if(data.user===username){
        li.classList.add("me");
        li.innerHTML=data.text;
    }else{
        li.innerHTML="<b>"+data.user+"</b><br>"+data.text;
    }

    document.getElementById("messages").appendChild(li);
    li.scrollIntoView();
});

// mensaje sistema
socket.on("system message",function(msg){
    const li=document.createElement("li");
    li.classList.add("system");
    li.textContent=msg;
    document.getElementById("messages").appendChild(li);
});

// lista de usuarios conectados
socket.on("user list", function(users){
    const ul=document.getElementById("users");
    ul.innerHTML="";

    users.forEach(u=>{
        const li=document.createElement("li");
        li.textContent=u;
        ul.appendChild(li);
    });
});

const mensajeInput = document.getElementById("input");
let escribiendoTimeout;

mensajeInput.addEventListener("input", () => {
        socket.emit("escribiendo", username);

        clearTimeout(escribiendoTimeout);

        escribiendoTimeout = setTimeout(() => {
                socket.emit("dejoDeEscribir");
        }, 1000);
});

const typingDiv = document.getElementById("typing-indicator");

socket.on("escribiendo", (nombre)=>{
    typingDiv.textContent = nombre + " está escribiendo...";
});

socket.on("dejoDeEscribir", ()=>{
    typingDiv.textContent = "";
});

function toggleMenu(){
    document.querySelector(".channels").classList.toggle("open");
}

// cerrar menú tocando fuera
document.addEventListener("click", function(e){

    const channels = document.querySelector(".channels");
    const btn = document.querySelector(".menu-btn");

    if(!channels.contains(e.target) && !btn.contains(e.target)){
        channels.classList.remove("open");
    }

});

// recibir historial
socket.on("chat history", function(history){

    const ul=document.getElementById("messages");
    ul.innerHTML="";

    history.forEach(data=>{
        const li=document.createElement("li");

        if(data.user===username){
            li.classList.add("me");
            li.innerHTML=data.text;
        }else{
            li.innerHTML="<b>"+data.user+"</b><br>"+data.text;
        }

        ul.appendChild(li);
    });

    ul.scrollTop=ul.scrollHeight;
});
</script>

</body>
</html>
